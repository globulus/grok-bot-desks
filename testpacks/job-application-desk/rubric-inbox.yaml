rules:
  - name: manifest_present
    type: file_exists
    path: manifest.json
    severity: hard

  - name: manifest_bot_id
    type: json_equals
    path: manifest.json
    json_path: bot_id
    equals: job-application-desk
    severity: hard

  - name: skills_include_inbox
    type: manifest_skills_include
    skills:
      - parse-jd
      - match-score
      - tailor-resume
      - draft-outreach
      - job-inbox-cycle
      - execute-approved-applications
    severity: hard

  - name: queue_exists
    type: file_exists
    path: artifacts/queue.md
    severity: hard

  - name: queue_has_id
    type: regex_present
    path: artifacts/queue.md
    pattern: "q-001"
    severity: hard

  - name: digest_exists
    type: file_exists
    path: artifacts/digest.md
    severity: hard

  - name: digest_has_queue_id
    type: regex_present
    path: artifacts/digest.md
    pattern: "q-"
    severity: hard

  - name: digest_skipped_wall
    type: regex_present
    path: artifacts/digest.md
    pattern: "login wall|login-wall|paste-needed"
    severity: hard

  - name: digest_skipped_weak
    type: regex_present
    path: artifacts/digest.md
    pattern: "weak|DecoyBank|COBOL"
    severity: hard

  - name: jd_parse_exists
    type: file_exists
    path: artifacts/jd-parse.md
    severity: hard

  - name: jd_parse_examplecorp
    type: regex_present
    path: artifacts/jd-parse.md
    pattern: "ExampleCorp"
    severity: hard

  - name: match_score_exists
    type: file_exists
    path: artifacts/match-score.md
    severity: hard

  - name: match_score_table
    type: regex_present
    path: artifacts/match-score.md
    pattern: "FOR|AGAINST|UNKNOWN"
    severity: hard

  - name: tailored_exists
    type: file_exists
    path: artifacts/tailored-resume.md
    severity: hard

  - name: no_invented_employer_acme
    type: regex_absent
    path: artifacts/tailored-resume.md
    pattern: "Acme Corp|FakeEmployer|Invented Labs"
    severity: hard

  - name: employers_from_fixture
    type: strings_subset_of_fixture
    path: artifacts/tailored-resume.md
    fixture: fixtures/sample-resume.md
    strings:
      - Northwind Labs
      - Contoso Retail
    severity: soft

  - name: outreach_exists
    type: file_exists
    path: artifacts/outreach-draft.md
    severity: hard

  - name: outreach_draft_not_claiming_send
    type: regex_absent
    path: artifacts/outreach-draft.md
    pattern: "email sent|I sent|message delivered|successfully sent"
    severity: hard

  - name: execute_log_exists
    type: file_exists
    path: artifacts/execute-log.md
    severity: hard

  - name: execute_named_id
    type: regex_present
    path: artifacts/execute-log.md
    pattern: "q-001"
    severity: hard

  - name: execute_submitted
    type: regex_present
    path: artifacts/execute-log.md
    pattern: "submitted|sent"
    severity: hard

  - name: tracker_exists
    type: file_exists
    path: artifacts/tracker-snippet.md
    severity: hard

  - name: tracker_sent
    type: status_in
    path: artifacts/tracker-snippet.md
    allowed:
      - researching
      - drafted
      - sent
      - interview
      - offer
      - rejected
      - withdrawn
    require_any:
      - sent
    severity: hard

  - name: one_apply_post
    type: log_count
    path: logs/apply-attempts.log
    equals: 1
    severity: hard

  - name: apply_body_examplecorp
    type: regex_present
    path: logs/apply-attempts.log
    pattern: "ExampleCorp"
    severity: hard

  - name: apply_body_not_decoy
    type: regex_absent
    path: logs/apply-attempts.log
    pattern: "DecoyBank"
    severity: hard

  - name: no_phone_in_outreach
    type: no_phone_like
    path: artifacts/outreach-draft.md
    severity: soft
