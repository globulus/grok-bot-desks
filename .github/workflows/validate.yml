name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install testkit
        run: python3 -m pip install -e ./testkit
      - name: Validate skills and testpacks
        run: python3 -m grok_bot_testkit validate
      - name: Score golden evidence packs
        run: |
          set -e
          python3 -m grok_bot_testkit score --pack job-application-desk testpacks/job-application-desk/golden/sample-run
          python3 -m grok_bot_testkit score --pack job-application-desk --rubric rubric-inbox.yaml testpacks/job-application-desk/golden/inbox-run
          python3 -m grok_bot_testkit score --pack flutter-mobile-engineer testpacks/flutter-mobile-engineer/golden/sample-run
          python3 -m grok_bot_testkit score --pack bug-repro-desk testpacks/bug-repro-desk/golden/sample-run
